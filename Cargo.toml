[package]
name = "mini-mdr"
version = "0.2.0"
edition = "2024"
description = "A tray-only UPnP/DLNA MediaRenderer with a pluggable player backend"
license = "MIT"
repository = "https://github.com/chenzhenhong/mini-mdr"

[dependencies]
anyhow = "1"
directories = "6"
fluent = "0.16"
fluent-bundle = "0.16"
ldtray = "0.1.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
unic-langid = "0.9"

[package.metadata.deb]
name = "mini-mdr"
maintainer = "chenzhenhong <2246467700@qq.com>"
copyright = "2024, chenzhenhong"
license-file = ["LICENSE", "0"]
extended-description = "A tray-only UPnP/DLNA MediaRenderer with a pluggable player backend"
section = "sound"
priority = "optional"
assets = [
    ["target/release/mini-mdr", "usr/bin/", "755"],
]
depends = "libmpv2"

[package.metadata.bundle]
name = "mini-mdr"
identifier = "com.mini-mdr.app"
icon = "resources/icon.icns"
category = "public.app-category.music"
short-description = "UPnP/DLNA MediaRenderer"
