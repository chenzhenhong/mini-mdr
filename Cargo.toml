[package]
name = "mini-mdr"
version = "0.2.40"
edition = "2024"
description = "A tray-only UPnP/DLNA MediaRenderer with a pluggable player backend"
license = "MIT"
repository = "https://github.com/chenzhenhong/mini-mdr"

[dependencies]
anyhow = "1"
directories = "6"
local-ip-address = "0.6"
libc = "0.2"
socket2 = "0.5"
fluent = "0.16"
fluent-bundle = "0.16"
ldtray = "0.1.2"
notify = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
unic-langid = "0.9"

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "mini-mdr"
maintainer = "chenzhenhong <chenzhenhong2@gmail.com>"
copyright = "2024, chenzhenhong"
license-file = ["LICENSE", "0"]
extended-description = "A tray-only UPnP/DLNA MediaRenderer with a pluggable player backend"
section = "sound"
priority = "optional"
assets = [
    ["target/release/mini-mdr", "usr/bin/", "755"],
]
depends = "libmpv2"

[package.metadata.bundle]
name = "mini-mdr"
identifier = "com.mini-mdr.app"
icon = "resources/icon.icns"
category = "public.app-category.music"
short-description = "UPnP/DLNA MediaRenderer"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mini-mdr", dest = "/usr/bin/mini-mdr", mode = "755" },
    { source = "resources/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/mini-mdr.png" },
]

[profile.release]
strip = true
lto = true
