[package]
name = "mini-mdr"
version = "0.1.0"
edition = "2024"
description = "A tray-only UPnP/DLNA MediaRenderer with a pluggable player backend"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
fluent = "0.16"
fluent-bundle = "0.16"
ldtray = "0.1.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unic-langid = "0.9"
