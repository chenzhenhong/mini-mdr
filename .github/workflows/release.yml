name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Get version
        id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/mini-mdr mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/mini-mdr.exe mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.exe

      - name: Upload binary
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}*

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb

      - name: Build deb
        if: runner.os == 'Linux'
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Rename deb
        if: runner.os == 'Linux'
        run: mv target/${{ matrix.target }}/debian/*.deb mini-mdr_${{ steps.version.outputs.value }}_${{ matrix.platform }}.deb

      - name: Upload deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: mini-mdr_${{ steps.version.outputs.value }}_${{ matrix.platform }}.deb
          path: mini-mdr_${{ steps.version.outputs.value }}_${{ matrix.platform }}.deb

      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm

      - name: Build rpm
        if: runner.os == 'Linux'
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Rename rpm
        if: runner.os == 'Linux'
        run: mv target/${{ matrix.target }}/generate-rpm/*.rpm mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.rpm

      - name: Upload rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.rpm
          path: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.rpm

      - name: Build dmg
        if: runner.os == 'macOS'
        run: |
          APP=mini-mdr
          VERSION=${{ steps.version.outputs.value }}
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/macOS/${APP}.app"
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS" "${BUNDLE_DIR}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/${APP}" "${BUNDLE_DIR}/Contents/MacOS/${APP}"
          cp resources/icon.png "${BUNDLE_DIR}/Contents/Resources/icon.png"
          cat > "${BUNDLE_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>${APP}</string>
              <key>CFBundleIdentifier</key><string>com.mini-mdr.app</string>
              <key>CFBundleName</key><string>${APP}</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleIconFile</key><string>icon</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "${APP}" -srcfolder "${BUNDLE_DIR}" -ov -format UDZO "mini-mdr-${VERSION}-${{ matrix.platform }}.dmg"

      - name: Upload dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.dmg
          path: mini-mdr-${{ steps.version.outputs.value }}-${{ matrix.platform }}.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: mini-mdr-*
          generate_release_notes: true
