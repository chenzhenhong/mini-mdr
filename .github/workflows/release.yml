name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mini-mdr-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mini-mdr-macos-amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mini-mdr-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/mini-mdr ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/mini-mdr.exe ${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb

      - name: Build deb
        if: runner.os == 'Linux'
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Upload deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: mini-mdr-linux-amd64.deb
          path: target/${{ matrix.target }}/debian/*.deb

      - name: Build dmg
        if: runner.os == 'macOS'
        run: |
          APP=mini-mdr
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/macOS/${APP}.app"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p "${BUNDLE_DIR}/Contents/MacOS" "${BUNDLE_DIR}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/${APP}" "${BUNDLE_DIR}/Contents/MacOS/${APP}"
          cp resources/icon.png "${BUNDLE_DIR}/Contents/Resources/icon.png"
          cat > "${BUNDLE_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>${APP}</string>
              <key>CFBundleIdentifier</key><string>com.mini-mdr.app</string>
              <key>CFBundleName</key><string>${APP}</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleIconFile</key><string>icon</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "${APP}" -srcfolder "${BUNDLE_DIR}" -ov -format UDZO "mini-mdr-macos-amd64.dmg"

      - name: Upload dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: mini-mdr-macos-amd64.dmg
          path: mini-mdr-macos-amd64.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: mini-mdr-*
          generate_release_notes: true
